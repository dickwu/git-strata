[package]
name = "strata-session"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "git-strata session: sessions of sibling workspaces on pinned base generations, moves, removal and recovery"

[features]
default = []
# Test seams (session.md §3 SessionSeam). Also turns on the store and apfs
# seams the session tests drive.
test-seams = ["strata-store/test-seams", "strata-apfs/test-seams"]

[dependencies]
strata-types = { path = "../strata-types" }
strata-apfs = { path = "../strata-apfs" }
strata-gitio = { path = "../strata-gitio" }
strata-store = { path = "../strata-store" }
strata-deps = { path = "../strata-deps" }
strata-overlay = { path = "../strata-overlay" }
libc = "0.2.191"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
strata-session = { path = ".", features = ["test-seams"] }
strata-gitio = { path = "../strata-gitio", features = ["test-seams"] }
