[package]
name = "strata-apfs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "APFS primitives for git-strata: clonefile, rooted no-follow I/O, bulk attributes, FSEvents"

[features]
default = []
test-seams = []

[dependencies]
strata-types = { path = "../strata-types" }
libc = "0.2.191"
serde_json = "1"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
