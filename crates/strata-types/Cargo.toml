[package]
name = "strata-types"
version = "0.3.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared identifiers, errors, and config types for git-strata"

[features]
# Every lower-layer test seam propagates this artifact marker to its consumers.
test-seams = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1.2.1", features = ["preserve_order"] }
unicode-normalization = "0.1"

[lints]
workspace = true
