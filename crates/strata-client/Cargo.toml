[package]
name = "strata-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "git-strata: the pure json-lines transport to git-stratad, shared by the CLI and the desktop app (gui.md §3.1)"

[dependencies]
strata-types = { path = "../strata-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
