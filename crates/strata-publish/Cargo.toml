[package]
name = "strata-publish"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "git-strata publish: path-level merge of release groups into one commit per repo, checks, the publish chain and push"

[features]
default = []
# Test seams (publish.md §3 PublishFault). Also turns on the gitio, store,
# apfs and session seams the publish tests drive.
test-seams = ["strata-gitio/test-seams", "strata-store/test-seams", "strata-apfs/test-seams", "strata-session/test-seams", "strata-deps/test-seams"]

[dependencies]
strata-types = { path = "../strata-types" }
strata-apfs = { path = "../strata-apfs" }
strata-gitio = { path = "../strata-gitio" }
strata-store = { path = "../strata-store" }
strata-deps = { path = "../strata-deps" }
strata-overlay = { path = "../strata-overlay" }
strata-session = { path = "../strata-session" }
blake3 = "1"
libc = "0.2.191"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
strata-publish = { path = ".", features = ["test-seams"] }
strata-confirm = { path = "../strata-confirm" }
