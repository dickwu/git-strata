[workspace]
resolver = "3"
exclude = ["vendor", "apps/desktop/src-tauri"]
members = ["crates/strata-types", "crates/strata-client", "crates/strata-apfs", "crates/strata-confirm", "crates/strata-gitio", "crates/strata-store", "crates/strata-deps", "crates/strata-overlay", "crates/strata-session", "crates/strata-search", "crates/strata-publish", "crates/strata-daemon", "crates/git-strata"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dickwu/git-strata"
homepage = "https://github.com/dickwu/git-strata"

# Clippy baseline. `cargo clippy --workspace --all-targets -- -D warnings` is
# clean with it on the stable toolchain (measured with 1.99). Each lint allowed
# here fires at exactly one site today, named on its line: fix that site, then
# delete the line.
[workspace.lints.clippy]
# A deny-by-default correctness lint, off workspace-wide for one `from_mode(0)`
# in a test. Fix this one first: write `0o0`.
non_octal_unix_permissions = "allow"  # crates/strata-session/tests/remove.rs
# Newer than the 1.88 MSRV: clippy 1.88 reports this name as an unknown lint.
cloned_ref_to_slice_refs = "allow"    # crates/strata-daemon/tests/auto_close.rs
field_reassign_with_default = "allow" # crates/strata-session/src/remove.rs
large_enum_variant = "allow"          # crates/strata-daemon/src/auto_close.rs
manual_contains = "allow"             # crates/strata-gitio/src/upstream.rs
useless_vec = "allow"                 # crates/strata-daemon/src/audit.rs
