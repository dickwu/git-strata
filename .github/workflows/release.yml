# Release: build git-strata + git-stratad and GIT STRATA.app on an Apple
# silicon runner, sign them, and attach them to a GitHub Release that the
# dickwu/homebrew-tap formula (tarball), cask (DMG) and in-app updater download.
#
# Triggers: pushing a v* tag (builds, publishes the GitHub Release, and updates
# the Homebrew tap), or by hand (builds and uploads workflow artifacts only;
# nothing is published).
#
# Code signing uses a stable identity on dickwu/git-strata release tags:
#   developer-id  APPLE_DEVELOPER_ID_P12 (base64 .p12), APPLE_DEVELOPER_ID_P12_PASSWORD;
#                 notarized when APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID are set too.
#                 Variable APPLE_DEVELOPER_ID_CERT_SHA1 (optional) pins the certificate.
#   self-signed   default unless Developer ID is configured. STRATA_CODESIGN_P12,
#                 STRATA_CODESIGN_P12_PASSWORD (see desktop-pack.yml);
#                 variable STRATA_CODESIGN_CERT_SHA1 (optional) pins the certificate.
#   adhoc         available to forks and dry runs without code signing secrets.
# The updater requires TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
# What each means for Gatekeeper, TCC and Touch ID: docs/release.md.
#
# A tag push publishes the GitHub Release (it is not left as a draft). That
# makes the artifacts public for Homebrew and moves releases/latest, so the
# in-app update is live when the workflow finishes. Publishing with
# GITHUB_TOKEN does not trigger other workflows, so the update-tap job in this
# workflow updates dickwu/homebrew-tap (version, URLs, sha256) with
# HOMEBREW_TAP_TOKEN (contents:write on that repo). homebrew.yml remains for
# workflow_dispatch reruns and for a release published by hand.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  MACOSX_DEPLOYMENT_TARGET: '13.0'
  TARGET: aarch64-apple-darwin

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
      sign_kind: ${{ steps.kind.outputs.kind }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Version (tag, crates and app must agree)
        id: version
        run: |
          v_cli="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="git-strata") | .version')"
          v_daemon="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="strata-daemon") | .version')"
          v_app="$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"
          echo "git-strata $v_cli, strata-daemon $v_daemon, app $v_app"
          [[ "$v_cli" == "$v_daemon" && "$v_cli" == "$v_app" ]] || { echo "::error::versions differ"; exit 1; }
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "v$v_cli" ]] || { echo "::error::tag $GITHUB_REF_NAME is not v$v_cli"; exit 1; }
          fi
          echo "version=$v_cli" >> "$GITHUB_OUTPUT"

      - name: Pick the signing identity
        id: kind
        env:
          DEVID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          SELF_P12: ${{ secrets.STRATA_CODESIGN_P12 }}
        run: |
          if [[ -n "$DEVID_P12" ]]; then kind=developer-id
          elif [[ -n "$SELF_P12" ]]; then kind=self-signed
          elif [[ "$GITHUB_REPOSITORY" == dickwu/git-strata && "$GITHUB_REF_TYPE" == tag &&
                  "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            echo "::error::STRATA_CODESIGN_P12 is required for self-signed release tags without a Developer ID identity"
            exit 1
          else kind=adhoc; fi
          echo "Signing: $kind"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "STRATA_SIGN_KIND=$kind" >> "$GITHUB_ENV"

      - name: Check updater signing credentials
        id: updater
        env:
          UPDATER_SIGNING_READY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
        run: |
          if [[ "$UPDATER_SIGNING_READY" != true ]]; then
            if [[ "$GITHUB_REPOSITORY" == dickwu/git-strata && "$GITHUB_EVENT_NAME" == push &&
                  "$GITHUB_REF_TYPE" == tag ]]; then
              echo "::error::Official release tags require TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
              exit 1
            fi
            echo "Skipping updater artifacts because both signing secrets are required."
          fi
          echo "ready=$UPDATER_SIGNING_READY" >> "$GITHUB_OUTPUT"

      - name: Set up Minisign
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 -o minisign.zip \
            https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-macos.zip
          echo "89000b19535765f9cffc65a65d64a820f433ef6db8020667f7570e06bf6aac63  minisign.zip" | shasum -a 256 -c -
          unzip -q minisign.zip minisign -d minisign-bin
          echo "$RUNNER_TEMP/minisign-bin" >> "$GITHUB_PATH"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Build git-strata and git-stratad (release)
        run: cargo build --release --locked --target "$TARGET" -p strata-daemon -p git-strata

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: bun install --frozen-lockfile

      - name: Test updater artifacts with disposable keys
        run: bash apps/desktop/scripts/tests/test-updater-artifacts.sh

      - name: Frontend checks
        working-directory: apps/desktop
        run: bun run typecheck

      - name: Build the app bundle (unsigned; signed below)
        working-directory: apps/desktop
        run: bun run tauri build --bundles app --target aarch64-apple-darwin
        env:
          CI: true

      - name: Release build has no connector and keeps a CSP
        run: |
          bash apps/desktop/scripts/check-release-no-connector.sh \
            apps/desktop/src-tauri/target/aarch64-apple-darwin/release/git-strata-desktop

      - name: Import the Developer ID identity
        if: steps.kind.outputs.kind == 'developer-id'
        run: apps/desktop/pack/import-identity.sh
        env:
          STRATA_CODESIGN_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          STRATA_CODESIGN_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          STRATA_CODESIGN_CERT_SHA1: ${{ vars.APPLE_DEVELOPER_ID_CERT_SHA1 }}

      - name: Import the self-signed identity
        if: steps.kind.outputs.kind == 'self-signed'
        run: apps/desktop/pack/import-identity.sh
        env:
          STRATA_CODESIGN_P12: ${{ secrets.STRATA_CODESIGN_P12 }}
          STRATA_CODESIGN_P12_PASSWORD: ${{ secrets.STRATA_CODESIGN_P12_PASSWORD }}
          STRATA_CODESIGN_CERT_SHA1: ${{ vars.STRATA_CODESIGN_CERT_SHA1 }}

      - name: Sign and pack the CLI tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          id="${STRATA_SIGN_ID:--}"
          scripts/release/package-cli.sh "target/$TARGET/release" "$id" "$VERSION" dist

      - name: Assemble, sign, check DRs, make the DMG
        run: |
          id="${STRATA_SIGN_ID:--}"
          apps/desktop/pack/assemble.sh \
            "apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/GIT STRATA.app" \
            "target/$TARGET/release" "$id" pack-out
          mv pack-out/*.dmg dist/
          cat pack-out/pack-record.md >> "$GITHUB_STEP_SUMMARY"

      - name: Notarize (Developer ID with notarization secrets only)
        if: steps.kind.outputs.kind == 'developer-id'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -z "$APPLE_ID" || -z "$APPLE_APP_SPECIFIC_PASSWORD" || -z "$APPLE_TEAM_ID" ]]; then
            echo "::warning::Developer ID signed but not notarized (APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID missing)"
            exit 0
          fi
          notarize() {
            local out status
            out="$(xcrun notarytool submit "$1" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" --wait --timeout 30m --output-format json)"
            echo "$out"
            status="$(plutil -extract status raw -o - - <<< "$out")"
            [[ "$status" == Accepted ]] || { echo "::error::notarization of $1: $status"; exit 1; }
          }
          # Notarization covers the DMG and the app inside it. Staple each distribution copy.
          dmg="dist/Git-Strata_${VERSION}_arm64.dmg"
          notarize "$dmg"
          xcrun stapler staple "$dmg"
          xcrun stapler staple "pack-out/GIT STRATA.app"
          # The CLI binaries: bare Mach-O cannot be stapled; notarize a zip so Gatekeeper
          # finds the ticket online. (Homebrew's download does not quarantine them anyway.)
          tmp="$(mktemp -d)"
          tar -C "$tmp" -xzf "dist/git-strata-$VERSION-$TARGET.tar.gz"
          ditto -c -k "$tmp/git-strata-$VERSION-$TARGET/bin" "$tmp/cli.zip"
          notarize "$tmp/cli.zip"

      - name: Restore the keychain search list and remove the signing keychain
        if: always() && env.STRATA_SIGN_KEYCHAIN != ''
        run: apps/desktop/pack/import-identity.sh --restore

      - name: Homebrew artifact checksums
        working-directory: dist
        run: |
          shasum -a 256 -- *.tar.gz *.dmg > SHA256SUMS.txt
          for f in *.tar.gz *.dmg; do shasum -a 256 -- "$f" > "$f.sha256"; done

      - name: Package and verify the updater artifacts
        if: steps.updater.outputs.ready == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/release/updater-artifacts.sh "pack-out/GIT STRATA.app" "$VERSION" dist

      - name: Record final checksums
        working-directory: dist
        run: |
          cat SHA256SUMS.txt
          { echo; echo "## SHA256SUMS"; echo; echo '```'; cat SHA256SUMS.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke the tarball (version and print-plist only; never starts a daemon)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tmp="$(mktemp -d)"
          tar -C "$tmp" -xzf "dist/git-strata-$VERSION-$TARGET.tar.gz"
          d="$tmp/git-strata-$VERSION-$TARGET"
          "$d/bin/git-strata" --version
          "$d/bin/git-stratad" --version
          "$d/bin/git-stratad" --print-plist /opt/homebrew/opt/git-strata/bin/git-stratad | plutil -lint -
          test -f "$d/share/git-strata/config.toml"

      - uses: actions/upload-artifact@v5
        with:
          name: release-${{ steps.version.outputs.version }}-arm64
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-${{ needs.build.outputs.version }}-arm64
          path: dist

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          KIND: ${{ needs.build.outputs.sign_kind }}
        run: |
          cat > notes.md <<NOTES
          Apple silicon (arm64), macOS 13+. Signing: **$KIND** (see docs/release.md).

          \`\`\`sh
          brew install dickwu/tap/git-strata                 # CLI + daemon
          brew install --cask dickwu/tap/git-strata-desktop  # desktop app
          \`\`\`

          If macOS blocks the app: System Settings > Privacy & Security > Open Anyway, or
          \`sudo xattr -dr com.apple.quarantine "/Applications/GIT STRATA.app"\`.
          NOTES
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Only a draft may get new files: replacing published assets would break
            # the sha256 already in dickwu/homebrew-tap. Bump the version instead.
            draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [[ "$draft" != true ]]; then
              echo "::error::release $TAG is already published; refusing to replace its assets"
              exit 1
            fi
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "git-strata $TAG" --notes-file notes.md --generate-notes
          fi

  # GITHUB_TOKEN cannot fire homebrew.yml (release published event), so the tap
  # is updated here after the GitHub Release is public. Homebrew fetches the
  # tarball and DMG anonymously; a draft would 404.
  update-tap:
    needs: publish
    # Official stable tags only. A fork tag would hash the fork's assets while
    # render-tap.sh still points URLs at dickwu/git-strata. Pre-release tags
    # (v0.3.0-rc.1 and similar) do not move Homebrew users.
    if: github.repository == 'dickwu/git-strata' && github.event_name == 'push' && github.ref_type == 'tag' && !contains(github.ref_name, '-')
    # Share the group with homebrew.yml so two PUTs cannot interleave and leave
    # the formula and cask on different versions.
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Version from tag
        id: version
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad tag $TAG"; exit 1; }
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: |
            packaging/homebrew
            scripts/release

      - name: Download the artifacts and compute SHA256
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Prefer the API (GITHUB_TOKEN) so we do not race the public CDN.
          draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [[ "$draft" != "false" ]]; then
            echo "::error::release $TAG is still a draft; Homebrew needs a public release"
            exit 1
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "git-strata-${VERSION}-aarch64-apple-darwin.tar.gz" \
            --pattern "Git-Strata_${VERSION}_arm64.dmg"
          echo "tarball=$(sha256sum "git-strata-${VERSION}-aarch64-apple-darwin.tar.gz" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "dmg=$(sha256sum "Git-Strata_${VERSION}_arm64.dmg" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Render formula and cask
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA_TARBALL: ${{ steps.sha.outputs.tarball }}
          SHA_DMG: ${{ steps.sha.outputs.dmg }}
        run: |
          scripts/release/render-tap.sh "$VERSION" "$SHA_TARBALL" "$SHA_DMG" out
          cat out/Formula/git-strata.rb out/Casks/git-strata-desktop.rb

      - name: Update dickwu/homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          [[ -n "$GH_TOKEN" ]] || { echo "::error::secret HOMEBREW_TAP_TOKEN is not set"; exit 1; }
          put() { # local file, path in the tap
            local encoded existing
            encoded="$(base64 -w 0 "$1")"
            # Public contents SHA; do not send the write token on the GET.
            existing="$(curl -fsSL -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/dickwu/homebrew-tap/contents/$2" \
              | jq -r '.sha // empty' 2>/dev/null || true)"
            [[ "$existing" =~ ^[0-9a-f]{40}$ ]] || existing=""
            if [[ -n "$existing" ]]; then
              gh api "repos/dickwu/homebrew-tap/contents/$2" --method PUT \
                --field message="chore: update $(basename "$2" .rb) to ${VERSION}" \
                --field content="$encoded" --field sha="$existing" > /dev/null
            else
              gh api "repos/dickwu/homebrew-tap/contents/$2" --method PUT \
                --field message="chore: add $(basename "$2" .rb) ${VERSION}" \
                --field content="$encoded" > /dev/null
            fi
            echo "updated $2"
          }
          put out/Formula/git-strata.rb Formula/git-strata.rb
          put out/Casks/git-strata-desktop.rb Casks/git-strata-desktop.rb
