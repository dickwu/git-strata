# Update dickwu/homebrew-tap after a release (modelled on dickwu/r2's homebrew.yml).
# Official vX.Y.Z tags update the tap in release.yml's update-tap job, because a
# release published with GITHUB_TOKEN does not fire this workflow. This workflow
# remains for workflow_dispatch reruns, and for a release published by hand
# (which does fire `release: published`).
# Needs the repository secret HOMEBREW_TAP_TOKEN: a token with contents:write on
# dickwu/homebrew-tap. Writes Formula/git-strata.rb and Casks/git-strata-desktop.rb
# from packaging/homebrew/*.rb.in.
name: Update Homebrew tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish to Homebrew (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homebrew-tap
  cancel-in-progress: false

jobs:
  update-tap:
    # Official repo only (render-tap.sh URLs always point at dickwu/git-strata).
    # Stable vX.Y.Z tags only: a hand-published prerelease tag can have
    # prerelease=false, and dispatch must not push one either.
    if: github.repository == 'dickwu/git-strata' && (github.event_name == 'workflow_dispatch' || !github.event.release.prerelease)
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Version from tag
        id: version
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad tag $TAG (stable vX.Y.Z only)"; exit 1; }
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: |
            packaging/homebrew
            scripts/release

      - name: Download the artifacts and compute SHA256
        id: sha
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          base="https://github.com/dickwu/git-strata/releases/download/${TAG}"
          curl -fsSL "$base/git-strata-${VERSION}-aarch64-apple-darwin.tar.gz" -o cli.tar.gz
          curl -fsSL "$base/Git-Strata_${VERSION}_arm64.dmg" -o app.dmg
          echo "tarball=$(sha256sum cli.tar.gz | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "dmg=$(sha256sum app.dmg | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Render formula and cask
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA_TARBALL: ${{ steps.sha.outputs.tarball }}
          SHA_DMG: ${{ steps.sha.outputs.dmg }}
        run: |
          scripts/release/render-tap.sh "$VERSION" "$SHA_TARBALL" "$SHA_DMG" out
          cat out/Formula/git-strata.rb out/Casks/git-strata-desktop.rb

      - name: Update dickwu/homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          [[ -n "$GH_TOKEN" ]] || { echo "::error::secret HOMEBREW_TAP_TOKEN is not set"; exit 1; }
          put() { # local file, path in the tap
            local encoded existing
            encoded="$(base64 -w 0 "$1")"
            # Public contents SHA; do not send the write token on the GET.
            existing="$(curl -fsSL -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/dickwu/homebrew-tap/contents/$2" \
              | jq -r '.sha // empty' 2>/dev/null || true)"
            [[ "$existing" =~ ^[0-9a-f]{40}$ ]] || existing=""
            if [[ -n "$existing" ]]; then
              gh api "repos/dickwu/homebrew-tap/contents/$2" --method PUT \
                --field message="chore: update $(basename "$2" .rb) to ${VERSION}" \
                --field content="$encoded" --field sha="$existing" > /dev/null
            else
              gh api "repos/dickwu/homebrew-tap/contents/$2" --method PUT \
                --field message="chore: add $(basename "$2" .rb) ${VERSION}" \
                --field content="$encoded" > /dev/null
            fi
            echo "updated $2"
          }
          # Publish the formula and independent desktop cask to the same tap.
          put out/Formula/git-strata.rb Formula/git-strata.rb
          put out/Casks/git-strata-desktop.rb Casks/git-strata-desktop.rb
