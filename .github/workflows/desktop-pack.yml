# P-pack: packaging proof for the desktop app (docs/modules/gui.md §8.1).
# Modelled on R2's release.yml / ci.yml (bun + rust + tauri on macOS runners),
# with git-strata's own signing: a stable self-signed identity from secrets.
#
# Not run on push to main. Start it by hand (Actions → Desktop pack proof) or
# by pushing a desktop-pack-v* tag; peilin decides when CI goes live.
#
# Secrets (names only; values never in the repo):
#   STRATA_CODESIGN_P12            base64 of the .p12 from apps/desktop/scripts/make-signing-identity.sh
#   STRATA_CODESIGN_P12_PASSWORD   its password
# Variable (not secret):
#   STRATA_CODESIGN_CERT_SHA1      the certificate SHA-1; the build refuses any other identity
name: Desktop pack proof

on:
  workflow_dispatch:
    inputs:
      signing:
        description: self-signed (stable DR, the release path) or adhoc (cdhash DR, for comparison)
        type: choice
        options: [self-signed, adhoc]
        default: self-signed
  push:
    tags:
      - 'desktop-pack-v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SIGNING: ${{ inputs.signing || 'self-signed' }}
  MACOSX_DEPLOYMENT_TARGET: '13.0'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      - name: Build git-stratad and git-strata (core workspace)
        run: cargo build --release --locked --target aarch64-apple-darwin -p strata-daemon -p git-strata

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: bun install --frozen-lockfile

      - name: Frontend checks
        working-directory: apps/desktop
        run: |
          bun run typecheck
          bun test src

      - name: Signing-identity script test (fake security, no keychain)
        run: bash apps/desktop/scripts/tests/test-make-signing-identity.sh

      - name: Desktop crate tests
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build the app bundle (unsigned; signed below)
        working-directory: apps/desktop
        run: bun run tauri build --bundles app --target aarch64-apple-darwin
        env:
          CI: true

      - name: Release build keeps a CSP (gui_release_has_no_connector)
        run: |
          csp=$(jq -c '.app.security.csp' apps/desktop/src-tauri/tauri.conf.json)
          test "$csp" != "null" || { echo "::error::tauri.conf.json app.security.csp is null"; exit 1; }

      - name: Import the self-signed identity
        if: env.SIGNING == 'self-signed'
        run: apps/desktop/pack/import-identity.sh
        env:
          STRATA_CODESIGN_P12: ${{ secrets.STRATA_CODESIGN_P12 }}
          STRATA_CODESIGN_P12_PASSWORD: ${{ secrets.STRATA_CODESIGN_P12_PASSWORD }}
          STRATA_CODESIGN_CERT_SHA1: ${{ vars.STRATA_CODESIGN_CERT_SHA1 }}

      - name: Assemble, sign, check DRs, make the DMG
        run: |
          id="${STRATA_SIGN_ID:--}"
          [[ "$SIGNING" == adhoc ]] && id=-
          apps/desktop/pack/assemble.sh \
            "apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Git Strata.app" \
            target/aarch64-apple-darwin/release "$id" pack-out
          cat pack-out/pack-record.md >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the signing keychain
        if: always() && env.STRATA_SIGN_KEYCHAIN != ''
        run: security delete-keychain "$STRATA_SIGN_KEYCHAIN" || true

      - name: Upload the DMG and pack record
        uses: actions/upload-artifact@v5
        with:
          name: desktop-pack-${{ env.SIGNING }}-arm64
          path: |
            pack-out/*.dmg
            pack-out/pack-record.md
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # A fresh runner per OS: the app was never built or installed there.
        os: [macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: apps/desktop/pack

      - uses: actions/download-artifact@v5
        with:
          name: desktop-pack-${{ env.SIGNING }}-arm64
          path: pack-in

      - name: Install, first launch, register, daemon answers, uninstall
        run: apps/desktop/pack/smoke.sh pack-in/*.dmg smoke-out

      - name: Upload the smoke record
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: desktop-pack-smoke-${{ env.SIGNING }}-${{ matrix.os }}
          path: smoke-out/
