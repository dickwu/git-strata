name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  workspace:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.100
        with:
          components: clippy, rustfmt
      - name: Build
        run: cargo build --locked --workspace
      - name: Clippy (all targets)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Clippy (library and binaries)
        run: cargo clippy --locked --workspace -- -D warnings
      - name: Test
        run: env -u TMPDIR cargo test --locked --workspace --no-fail-fast

  desktop:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.100
        with:
          components: clippy
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: bun install --frozen-lockfile
      - name: Typecheck and unit tests
        working-directory: apps/desktop
        run: bun run check
      - name: Lint
        working-directory: apps/desktop
        run: bun run lint
      - name: Tauri tests
        run: env -u TMPDIR cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Tauri clippy
        run: cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Script tests
        shell: bash
        run: |
          set -u
          failed=0
          for s in apps/desktop/scripts/tests/test-*.sh; do
            echo "::group::$s"
            bash "$s" || { echo "::error::$s failed"; failed=1; }
            echo "::endgroup::"
          done
          exit $failed
