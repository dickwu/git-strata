<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="18" height="18" viewBox="0 0 36 36">
  <title>git-strata menu-bar template (tray-template-pending)</title>
  <desc>Concept b reduced for 18 pt: a Y-fork joining three flat workspace plates, black on transparent. Drawn on a 2-unit grid so it stays crisp at 18 px; the fork stops one pixel short of each plate so the plates read as separate shapes. A dot marks pending approvals.</desc>
  <defs>
    <path id="plates" d="M9 4.5 L16 8 L9 11.5 L2 8 Z M27 4.5 L34 8 L27 11.5 L20 8 Z M18 24.5 L25 28 L18 31.5 L11 28 Z"/>
    <mask id="fork-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="36" height="36">
      <rect width="36" height="36" fill="#fff"/>
      <use href="#plates" fill="#000" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="31" cy="20" r="6.5" fill="#000"/>
    </mask>
    <mask id="plate-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="36" height="36">
      <rect width="36" height="36" fill="#fff"/>
      <circle cx="31" cy="20" r="6.5" fill="#000"/>
    </mask>
  </defs>
  <path mask="url(#fork-cut)" d="M18 28 V20 C18 14.5 9 15 9 8 M18 20 C18 14.5 27 15 27 8" fill="none" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
  <use mask="url(#plate-cut)" href="#plates" fill="#000"/>
  <circle cx="31" cy="20" r="4" fill="#000"/>
</svg>
